
name: Build iPhone App and StandBy Widget (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ElderStandBy.xcodeproj/**'
      - 'ElderStandByApp/**'
      - 'ElderCalendarWidget/**'
      - 'Shared/**'
      - 'ElderClock_AppIcon_1024.png'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS App and Widget
        run: |
          set -euo pipefail
          xcodebuild \
            -project ElderStandBy.xcodeproj \
            -scheme ElderStandBy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Add Elder Clock App Icon
        run: |
          set -euo pipefail

          APP="build/Build/Products/Release-iphoneos/ElderStandBy.app"
          ICON="ElderClock_AppIcon_1024.png"

          test -d "$APP"
          test -f "$ICON"

          sips -s format png -z 120 120 "$ICON" \
            --out "$APP/ElderClockIcon@2x.png"

          sips -s format png -z 180 180 "$ICON" \
            --out "$APP/ElderClockIcon@3x.png"

          PLIST="$APP/Info.plist"

          /usr/libexec/PlistBuddy -c \
            "Add :CFBundleIcons dict" "$PLIST" || true

          /usr/libexec/PlistBuddy -c \
            "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$PLIST" || true

          /usr/libexec/PlistBuddy -c \
            "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" \
            "$PLIST" || true

          /usr/libexec/PlistBuddy -c \
            "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string ElderClockIcon" \
            "$PLIST" || true

          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 ElderClockIcon" \
            "$PLIST"

          echo "Elder Clock icon added successfully"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP='build/Build/Products/Release-iphoneos/ElderStandBy.app'
          test -d "$APP"
          test -d "$APP/PlugIns/ElderCalendarWidget.appex"
          mkdir -p Payload
          ditto "$APP" Payload/ElderStandBy.app
          /usr/bin/zip -qr ElderStandBy-unsigned.ipa Payload

      - name: Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: ElderStandBy-unsigned-ipa
          path: ElderStandBy-unsigned.ipa
          retention-days: 14
