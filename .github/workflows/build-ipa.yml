
name: Build iPhone App and StandBy Widget (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ElderStandBy.xcodeproj/**'
      - 'ElderStandByApp/**'
      - 'ElderCalendarWidget/**'
      - 'Shared/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS App and Widget
        run: |
          set -euo pipefail
          xcodebuild \
            -project ElderStandBy.xcodeproj \
            -scheme ElderStandBy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP='build/Build/Products/Release-iphoneos/ElderStandBy.app'
          test -d "$APP"
          test -d "$APP/PlugIns/ElderCalendarWidget.appex"
          mkdir -p Payload
          ditto "$APP" Payload/ElderStandBy.app
          /usr/bin/zip -qr ElderStandBy-unsigned.ipa Payload

      - name: Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: ElderStandBy-unsigned-ipa
          path: ElderStandBy-unsigned.ipa
          retention-days: 14
